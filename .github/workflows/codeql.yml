name: CodeQL

# Static analysis for a PUBLIC repo that holds release automation with a
# write-scoped PAT, code-signing configuration, and a web app that handles
# RSI session cookies. Findings land in the Security tab rather than as PR
# noise.
#
# Three languages are analysed:
#   rust                  — crates/starstats-{core,server,client}. Analysis
#                           went generally available in CodeQL 2.23.3
#                           (October 2025), as did build-free scanning, so
#                           no compile step is needed. It does need rustup
#                           and cargo on PATH, hence the toolchain step
#                           below, pinned to the same 1.88.0 the rest of CI
#                           uses so findings match what actually ships.
#   javascript-typescript — apps/web + apps/tray-ui + release scripts
#   actions               — the workflows themselves. Worth having: these
#                           files run with RELEASE_PROMOTE_PAT, the Azure
#                           signing identity and registry credentials, so a
#                           bad pattern there is worth more to an attacker
#                           than a bug in the app.
#
# Actions are pinned to commit SHAs for the same reason as everywhere else
# in this repo — a mutable tag is a supply-chain hole in a workflow that can
# read the Security tab.

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]
  schedule:
    # Weekly, so a newly published CodeQL query finds existing code even
    # when nobody has pushed. Sunday 03:17 UTC — off the hour to avoid the
    # scheduling stampede.
    - cron: '17 3 * * 0'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      # Least privilege: only what CodeQL needs to publish results.
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, actions]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    # Rust analysis is build-free but still shells out to cargo to resolve
    # the dependency graph, so the toolchain has to exist. Pinned to the
    # same version the Rust CI jobs use — analysing against a different
    # compiler than we ship would make findings hard to act on.
    - name: Install Rust toolchain
      if: matrix.language == 'rust'
      uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0

    - name: Initialize CodeQL
      uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
      with:
        language: ${{ matrix.language }}
        # security-and-quality is noisier than the default; stick to the
        # security queries so the Security tab stays actionable.
        queries: security-extended

    # No build step for any of the three: JS/TS and actions are
    # interpreted/declarative, and Rust scanning is build-free since
    # CodeQL 2.23.3.
    - name: Perform CodeQL analysis
      uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
      with:
        category: /language:${{ matrix.language }}

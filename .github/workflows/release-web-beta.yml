name: Release web (beta)

# Manual-only staging build for `beta.starstats.app`.
#
# Why this is a SEPARATE workflow rather than another branch route in
# `release-images.yml`:
#
#   * `release-images.yml` is push-driven — `main` moves `:latest`,
#     `next` moves `:next`. Beta must NOT auto-build; the operator
#     decides when the staging host changes under people who are
#     looking at it. `workflow_dispatch` is the only trigger here.
#   * Beta is a WEB-TIER-ONLY deploy. The container runs against the
#     LIVE API (`https://api.starstats.app`) and therefore the live
#     database. No `api:beta` image exists and none should be built
#     from this workflow — a beta API would run migrations against
#     production.
#
# Topology:
#
#   beta.starstats.app → web:beta   ─┐
#                                    ├─→ api:latest → live Postgres
#   starstats.app      → web:latest ─┘
#
# See docs/RELEASING.md § "Beta staging site" for the container env and
# the DNS/proxy route.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build (e.g. feat/redesign)'
        required: true
        type: string
      move_floating_tag:
        description: 'Move :beta to this build (uncheck to build a pinned tag only)'
        required: false
        default: true
        type: boolean

# Manual builds: the newest dispatch wins. Unlike `release-images.yml`
# (which must never cancel, because a cancelled tag run loses its
# version tag forever) nothing here is a release artifact — every build
# is reproducible by re-dispatching with the same `ref`.
concurrency:
  group: release-web-beta
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: registry-direct.tatux.in

jobs:
  build:
    name: Build & push web:beta
    runs-on: ubuntu-latest
    steps:
    # `ref` is operator-supplied. Checkout is `persist-credentials: false`
    # because nothing here pushes back to git — only to the registry.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ inputs.ref }}
        persist-credentials: false

    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Login to private registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - name: Resolve build metadata
      id: meta
      shell: bash
      env:
        MOVE_FLOATING: ${{ inputs.move_floating_tag }}
        # `ref` is operator-supplied free text. It reaches bash through
        # the environment, never through `${{ }}` expansion inside the
        # script body — an expansion there is textual substitution
        # BEFORE the shell parses, so a ref containing shell
        # metacharacters would execute as code on the runner.
        BUILD_REF: ${{ inputs.ref }}
      run: |
        set -euo pipefail
        # `github.sha` is the dispatch ref's SHA, but when a branch is
        # given the checkout above may resolve to a newer commit — read
        # it back from the working tree so the pinned tag names what was
        # actually built.
        SHA="$(git rev-parse HEAD)"
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"
        echo "pinned=beta-${SHA::7}" >> "$GITHUB_OUTPUT"
        if [[ "$MOVE_FLOATING" == "true" ]]; then
          echo "floating=beta" >> "$GITHUB_OUTPUT"
        else
          echo "floating=" >> "$GITHUB_OUTPUT"
        fi
        echo "built ref=$BUILD_REF sha=$SHA move_floating=$MOVE_FLOATING"

    # TRAP — do NOT add a `web:${{ github.sha }}` tag here.
    #
    # `release-images.yml` preflights `web:<full-sha>` and, when it
    # exists, RETAGS that manifest instead of rebuilding (the
    # "one build per SHA" optimisation). If this workflow published a
    # bare `:<full-sha>` for a redesign commit, a later live promote of
    # the same commit would silently retag the beta build as `:latest`
    # and ship staging to production without building anything.
    #
    # Beta owns the `beta` / `beta-<sha7>` namespace and nothing else.
    - name: Build & push web
      id: build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        context: .
        file: apps/web/Dockerfile
        push: true
        tags: |
          ${{ steps.meta.outputs.floating != '' && format('{0}/starstats/web:{1}', env.REGISTRY, steps.meta.outputs.floating) || '' }}
          ${{ env.REGISTRY }}/starstats/web:${{ steps.meta.outputs.pinned }}
        # Same Server Actions key as the production image. It must match
        # the value in the beta container's runtime env or every form
        # submit 404s with `UnrecognizedActionError`. Sharing the key
        # with prod is intentional and harmless — it only pins the
        # content-addressing of action IDs, it is not an auth secret.
        build-args: |
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        # Distinct cache scope from `starstats-web`. A redesign branch
        # carries different dependencies and layer hashes; sharing the
        # prod scope would evict the cache that `main` builds rely on.
        cache-from: type=gha,scope=starstats-web-beta
        cache-to: type=gha,mode=max,scope=starstats-web-beta

    - name: Summary
      shell: bash
      env:
        PINNED: ${{ steps.meta.outputs.pinned }}
        FLOATING: ${{ steps.meta.outputs.floating }}
        DIGEST: ${{ steps.build.outputs.digest }}
        SHA: ${{ steps.meta.outputs.sha }}
        # Same reasoning as the meta step — via env, not expansion.
        BUILD_REF: ${{ inputs.ref }}
      run: |
        set -euo pipefail
        {
          echo "### web:beta build"
          echo
          echo "| Field | Value |"
          echo "| --- | --- |"
          echo "| ref | \`${BUILD_REF}\` |"
          echo "| commit | \`${SHA}\` |"
          echo "| pinned tag | \`${REGISTRY}/starstats/web:${PINNED}\` |"
          if [[ -n "${FLOATING}" ]]; then
            echo "| floating tag | \`${REGISTRY}/starstats/web:${FLOATING}\` (moved) |"
          else
            echo "| floating tag | _not moved_ |"
          fi
          echo "| digest | \`${DIGEST}\` |"
          echo
          echo "Redeploy the \`starstats-web-beta\` service in Komodo to pick this up."
        } >> "$GITHUB_STEP_SUMMARY"
